# Builds Workrail on macOS, Windows and Linux and checks that the app starts
# (--smoke). On a version tag (v*), a final job creates ONE draft GitHub
# Release with all the installers (the builds never publish themselves:
# three parallel publishers would create three drafts). Run it by hand from
# the Actions tab to get the files as build artifacts without releasing.
name: Build & release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            dist: dist:mac
          - os: windows-latest
            dist: dist:win
          - os: ubuntu-latest
            dist: dist:linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Smoke test (macOS / Windows)
        if: runner.os != 'Linux'
        run: npx electron . --smoke

      - name: Smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a npx electron . --smoke --no-sandbox

      - name: Build installers
        run: npm run ${{ matrix.dist }} -- --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: workrail-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Workrail ${GITHUB_REF_NAME#v}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
