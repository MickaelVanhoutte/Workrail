<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'">
  <title>Workrail</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="rail.css">
</head>
<body>
  <!-- Windows/Linux: dark draggable strip above Gmail/Calendar/Jira, under the window controls -->
  <div class="topstrip"></div>
  <nav class="rail" aria-label="Apps">
    <div class="rail-drag"></div>
    <div class="rail-items">
      <button class="rail-item" data-view="home" title="Home (⌘1)">
        <span class="rail-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg>
          <span class="rail-badge" hidden></span>
        </span>
        <span class="rail-label">Home</span>
      </button>
      <button class="rail-item" data-view="chat" title="Chat (⌘2)">
        <span class="rail-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h14A1.5 1.5 0 0 1 20.5 6v9.5A1.5 1.5 0 0 1 19 17H9.5l-5 4V6A1.5 1.5 0 0 1 5 4.5z"/></svg>
          <span class="rail-badge" hidden></span>
        </span>
        <span class="rail-label">Chat</span>
      </button>
      <button class="rail-item" data-view="gmail" title="Mail (⌘3)">
        <span class="rail-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="1.5"/><path d="M4 7l8 6 8-6"/></svg>
          <span class="rail-badge" hidden></span>
        </span>
        <span class="rail-label">Mail</span>
      </button>
      <button class="rail-item" data-view="calendar" title="Calendar (⌘4)">
        <span class="rail-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="1.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>
          <span class="rail-badge time" hidden></span>
        </span>
        <span class="rail-label">Calendar</span>
      </button>
      <button class="rail-item" data-view="github" title="Reviews (⌘5)">
        <span class="rail-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6.5" cy="6" r="2"/><circle cx="6.5" cy="18" r="2"/><circle cx="17.5" cy="18" r="2"/><path d="M6.5 8v8M17.5 16V9.5a3 3 0 0 0-3-3H11M13 4l-2.5 2.5L13 9"/></svg>
          <span class="rail-badge" hidden></span>
        </span>
        <span class="rail-label">Reviews</span>
      </button>
      <button class="rail-item" data-view="jira" title="Jira (⌘6)">
        <span class="rail-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5A1.5 1.5 0 0 1 5.5 6h13A1.5 1.5 0 0 1 20 7.5v2a2.5 2.5 0 0 0 0 5v2a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 16.5v-2a2.5 2.5 0 0 0 0-5z"/><path d="M14.5 7.5v1.5M14.5 11.25v1.5M14.5 15v1.5"/></svg>
          <span class="rail-badge" hidden></span>
        </span>
        <span class="rail-label">Jira</span>
      </button>
    </div>
    <div class="rail-bottom">
      <button class="rail-update" id="update" type="button" hidden></button>
      <button class="rail-item" data-view="settings" title="Settings (⌘,)">
        <span class="rail-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
        </span>
        <span class="rail-label">Settings</span>
      </button>
    </div>
  </nav>
  <script src="rail.js"></script>
</body>
</html>
